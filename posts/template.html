<!DOCTYPE html>
<!-- Generated by posts/build.py; edit posts/template.html or posts/content instead. -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{title}} | Full Stack Flight</title>
  <meta name="description" content="{{description}}" />
  <meta property="og:title" content="{{title}}" />
  <meta property="og:description" content="{{description}}" />
  <link rel="stylesheet" href="{{root}}styles.css?v=no-footer-20261117" />
  <script src="{{root}}site.js" defer></script>
  <link rel="icon" type="image/svg+xml" href="{{root}}full-stack-flight.svg" />
  <style>
    .post { width: min(100% - 48px, 840px); margin: auto; padding: 64px 0 96px; overflow-wrap: anywhere; }
    .post-breadcrumb { margin-bottom: 32px; font-size: 14px; }
    .post h1 { margin-bottom: 24px; font-size: clamp(30px, 4vw, 46px); font-weight: 500; line-height: 1.18; letter-spacing: -1px; }
    .post-date { margin-bottom: 28px; color: var(--muted); font-size: 14px; }
    .post-content { font-size: 17px; line-height: 1.8; }
    .post-content > * + * { margin-top: 24px; }
    .post-content h2, .post-content h3, .post-content h4 { margin-top: 48px; font-weight: 500; line-height: 1.3; }
    .post-content h2 { font-size: 30px; letter-spacing: -0.5px; }
    .post-content h3 { font-size: 24px; }
    .post-content h4 { font-size: 20px; }
    .post-content ul, .post-content ol { padding-left: 28px; }
    .post-content li + li { margin-top: 8px; }
    .post-content li > p + p, .post-content li > ul, .post-content li > ol { margin-top: 12px; }
    .post-content img { display: block; height: auto; margin: 24px auto; }
    .post-content blockquote { padding: 12px 24px; border-left: 3px solid var(--accent); color: var(--muted); background: var(--bg-soft); }
    .post-content blockquote > * + * { margin-top: 16px; }
    .post-content code { padding: 2px 6px; border-radius: 4px; background: var(--panel); font-size: 0.88em; }
    .post-content pre { padding: 24px; overflow-x: auto; background: var(--bg-soft); border: 1px solid var(--border); border-radius: 6px; line-height: 1.6; }
    .post-content pre code { padding: 0; background: none; font-size: 14px; overflow-wrap: normal; }
    .post-content table { display: block; max-width: 100%; overflow-x: auto; border-collapse: collapse; font-size: 15px; }
    .post-content th, .post-content td { padding: 12px 16px; border: 1px solid var(--border); text-align: left; }
    .post-content th { background: var(--bg-soft); }
    .post-content hr { margin: 40px 0; border: 0; border-top: 1px solid var(--border); }
    .post-content iframe, .post-content video { max-width: 100%; }
    .post-content .post-list { list-style: none; padding: 0; }
    .post-list li { padding: 24px 0; border-bottom: 1px solid var(--border); }
    .post-list a { font-size: 21px; font-weight: 500; text-decoration: none; }
    .post-list a:hover { text-decoration: underline; }
    .post-list p { margin-top: 8px; color: var(--muted); font-size: 16px; }
    .post-list time { display: block; margin-top: 8px; color: var(--muted); font-size: 14px; }
    @media (max-width: 760px) {
      .post { width: calc(100% - 40px); padding: 40px 0 64px; }
      .post-content { font-size: 16px; }
      .post-content h2 { font-size: 26px; }
      .post-content pre { padding: 16px; }
    }
  </style>

  <!--Microsoft Clarity-->
  <script type="text/javascript">
      (function(c,l,a,r,i,t,y){
          c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
          t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
          y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
      })(window, document, "clarity", "script", "xu4obhn3yg");
  </script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="header-inner">
      <a class="site-brand" href="{{root}}" aria-label="Full Stack Flight home">
        <img src="{{root}}full-stack-flight.svg" alt="" width="43" height="43" />
        <span>Full Stack Flight</span>
      </a>
      <nav class="site-nav" id="site-nav" aria-label="Main navigation">
        <a href="{{root}}#ecosystem">Discover</a>
        <a href="{{root}}posts/"{{learn_current}}>Learn</a>
        <a href="{{root}}#community">Join</a>
        <a href="{{root}}#get-started">Build</a>
      </nav>
      <div class="header-actions">
        <a class="store-link" href="{{root}}shop/">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M5 7h14l1 14H4L5 7Z"/><path d="M9 9V6a3 3 0 0 1 6 0v3"/></svg>
          Shop
        </a>
        <button class="menu-toggle" type="button" aria-label="Toggle navigation" aria-expanded="false" aria-controls="site-nav">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main id="main">
    <article class="post">
      <p class="post-breadcrumb"><a href="{{root}}posts/">All articles</a></p>
      <h1>{{title}}</h1>
{{date}}
      <div class="post-content">
        {{content}}
      </div>
    </article>
  </main>
</body>
</html>
