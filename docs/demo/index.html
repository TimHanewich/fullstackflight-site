<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Explore the Centauri quadcopter, transmitter, and Link radio monitor together in an interactive 3D park scene." />
  <title>Centauri in Flight | Full Stack Flight</title>
  <link rel="icon" type="image/svg+xml" href="../full-stack-flight.svg" />
  <link rel="stylesheet" href="../styles.css" />
  <link rel="stylesheet" href="demo.css" />
  <script type="importmap">
    { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    } }
  </script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="header-inner demo-header">
      <a class="site-brand" href="../" aria-label="Full Stack Flight home">
        <img src="../full-stack-flight.svg" alt="" width="43" height="43" />
        <span>Full Stack Flight</span>
      </a>
      <a class="demo-back" href="../#ecosystem">Centauri ecosystem <span aria-hidden="true">&rarr;</span></a>
    </div>
  </header>

  <main class="demo" id="main">
    <p class="demo-kicker">The Centauri ecosystem / 3D demo</p>
    <h1>Centauri in flight</h1>
    <p class="demo-intro">A pilot flies Centauri from a picnic table while a second person farther down the path uses Link to check that radio messages are getting through.</p>

    <figure class="demo-figure">
      <div class="demo-scene">
        <div class="demo-stage">
          <canvas id="park" role="img" aria-label="In a sunny park, a seated pilot uses a wired Xbox controller connected to the Centauri transmitter. Green pulses show radio commands traveling to the hovering quadcopter. Farther down the path, a person holds the Link radio monitor."></canvas>
          <div class="demo-hotspots" id="demo-hotspots" role="group" aria-label="Explore the Centauri system" hidden>
            <button class="demo-hotspot" type="button" data-view="transmitter" aria-label="Explore the Centauri transmitter assembly">
              <span aria-hidden="true">Transmitter</span>
            </button>
            <button class="demo-hotspot" type="button" data-view="quadcopter" aria-label="Explore the Centauri quadcopter">
              <span aria-hidden="true">Quadcopter</span>
            </button>
            <button class="demo-hotspot" type="button" data-view="radio" aria-label="Inspect the radio signal from the transmitter to the quadcopter" aria-haspopup="dialog">
              <span aria-hidden="true">Radio signal</span>
            </button>
            <button class="demo-hotspot" type="button" data-view="link" aria-label="Inspect Centauri Link" aria-haspopup="dialog">
              <span aria-hidden="true">Link</span>
            </button>
            <button class="demo-hotspot" type="button" data-view="laptop" data-hotspot-scope="transmitter" aria-label="Inspect the laptop" aria-haspopup="dialog" hidden>
              <span aria-hidden="true">Laptop</span>
            </button>
            <button class="demo-hotspot" type="button" data-view="transceiver" data-hotspot-scope="transmitter" aria-label="Inspect the transceiver platform" aria-haspopup="dialog" hidden>
              <span aria-hidden="true">Transceiver Platform</span>
            </button>
            <button class="demo-hotspot" type="button" data-view="airframe" data-hotspot-scope="quadcopter" aria-haspopup="dialog" hidden>
              <span>Centauri Airframe</span>
            </button>
            <button class="demo-hotspot" type="button" data-view="flight-controller" data-hotspot-scope="quadcopter" aria-haspopup="dialog" hidden>
              <span>Centauri Flight Controller</span>
            </button>
          </div>
          <button id="demo-overview" type="button" hidden><span aria-hidden="true">&larr; </span>Back to overview</button>
          <p id="demo-status" class="demo-status" role="status"></p>
          <noscript><p class="demo-status">Enable JavaScript to view the 3D scene.</p></noscript>
        </div>
        <dialog id="demo-details" class="demo-details" aria-labelledby="demo-details-title">
          <div class="demo-details__header">
            <h2 id="demo-details-title"></h2>
            <button id="demo-details-close" type="button" aria-label="Close details" autofocus>&times;</button>
          </div>
          <div data-details="airframe" data-title="Centauri Airframe" tabindex="0" hidden>
            <p>Centauri&rsquo;s airframe is a custom design you can 3D-print yourself. It&rsquo;s built around 5-inch propellers, with room for the battery and electronics. The <a href="https://www.thingiverse.com/thing:7429193">print files are free to download</a>!</p>
            <div class="airframe-carousel" role="group" aria-label="Airframe diagrams">
              <figure class="airframe-carousel__slide">
                <img src="https://i.imgur.com/pBxx105.png" width="1920" height="1080" loading="lazy" alt="Labeled layout of four arms, upper and lower plates, a three-piece antenna mast, an MPU-6050 mount, and an optional GoPro mount." />
              </figure>
              <figure class="airframe-carousel__slide" hidden>
                <img src="https://i.imgur.com/SDOqmRm.png" width="1920" height="1080" loading="lazy" alt="Top view showing propeller clearance and motor spacing: 200 mm side to side and front to back, 283 mm diagonally." />
              </figure>
              <div class="airframe-carousel__controls">
                <button type="button" data-slide-direction="-1" aria-label="Previous airframe diagram">&larr;</button>
                <span class="airframe-carousel__status" role="status">1 of 2: Printed parts</span>
                <button type="button" data-slide-direction="1" aria-label="Next airframe diagram">&rarr;</button>
              </div>
            </div>
          </div>
          <div data-details="flight-controller" data-title="Centauri Flight Controller" tabindex="0" hidden>
            <p class="flight-loop__intro">The flight controller is the software that turns your stick movements into motor adjustments. It runs on a tiny Raspberry Pi Pico, using motion sensors to see how the quadcopter is moving and adjusting all four motors to match what you ask it to do.</p>
            <div class="flight-loop" aria-label="Flight controller control loop" role="group">
              <p class="flight-loop__rate"><strong>250 loops per second</strong></p>
              <p class="flight-loop__hint">Shown in slow motion. Hover, tap, or tab to a step to learn more.</p>
              <div class="flight-loop__layout">
                <ol class="flight-loop__steps">
                  <li><button type="button" data-step="The HC-12 radio checks for new throttle, pitch, roll, and yaw commands from the pilot.">Receive control input</button></li>
                  <li><button type="button" data-step="The MPU-6050 measures rotation and acceleration. The gyro tells the Pico how fast Centauri is turning on each axis.">Read the IMU</button></li>
                  <li><button type="button" data-step="PID compares the requested rotation rates with the measured rates and calculates corrections. It controls how fast Centauri turns, not what angle it holds.">Calculate PID corrections</button></li>
                  <li><button type="button" data-step="The Pico adjusts the four motor signals. Zero throttle or a timeout on valid commands overrides the corrections and stops the motors.">Update motor signals</button></li>
                  <li><button type="button" data-step="The Pico buffers flight data such as battery voltage and rotation rates. It sends radio status only when throttle is zero.">Record &amp; stream telemetry</button></li>
                  <li><button type="button" data-step="If the work finishes early, the Pico waits out the rest of the 4 ms time budget before starting the next pass.">Wait, then repeat</button></li>
                </ol>
                <div class="flight-loop__explanation" aria-live="polite" aria-atomic="true">
                  <h3 data-step-title></h3>
                  <p data-step-description></p>
                </div>
              </div>
            </div>
          </div>
          <div data-details="link" data-title="Centauri Link" tabindex="0" hidden>
            <p class="demo-details__lead">An extra pair of ears for your radio.</p>
            <p>Link is a handheld monitor that listens for Centauri radio messages and displays reception information on a small OLED screen. Walk away from the transmitter to check whether messages are still getting through, handy for troubleshooting and exploring approximate range without putting the aircraft in the air. It listens rather than controls, and a successful ground check doesn&rsquo;t guarantee safe flight range.</p>
          </div>
          <div data-details="laptop" data-title="Laptop" tabindex="0" hidden>
            <p class="demo-details__lead">Your laptop becomes the cockpit.</p>
            <p>A Python program reads your Xbox controller, softens small stick movements for finer control, and packs your inputs into control packets. While armed, it sends those commands through the transceiver platform 20 times per second. A terminal dashboard shows your inputs and aircraft status received while throttle is zero. Before flight, you can also wirelessly update PID settings&mdash;no editing and reflashing the flight controller just to try a new tune.</p>
          </div>
          <div data-details="transceiver" data-title="Transceiver Platform" tabindex="0" hidden>
            <p class="demo-details__lead">Giving your laptop a pair of radio ears&mdash;and a voice.</p>
            <p>This USB-connected platform bridges the laptop and quadcopter. A Raspberry Pi Pico running MicroPython relays outgoing messages to an HC-12 radio for transmission over the 433 MHz band, then passes incoming aircraft messages back to the PC. It doesn&rsquo;t interpret your stick movements or stabilize the drone: its job is to move messages between USB and radio, unchanged.</p>
          </div>
          <div data-details="radio" data-title="Radio communication protocol" tabindex="0" hidden>
            <p class="demo-details__lead">Your stick movements, packed for the trip.</p>
            <p>Twenty times per second, the transmitter packs your throttle, pitch, roll, and yaw inputs into a compact binary control packet and sends it over HC-12 radio. Each transmission is just 13 bytes, including a header, the four inputs, two checksum bytes to help detect corrupted data, and an end marker. The quadcopter checks and unpacks the message, then uses those inputs to guide its flight controller. Small packets keep communication lightweight and your commands moving.</p>
          </div>
        </dialog>
      </div>
      <figcaption class="demo-toolbar" id="demo-toolbar" hidden>
        <p class="demo-hint" id="demo-view-caption" aria-live="polite">Select a glowing halo to take a closer look.</p>
        <button class="demo-motion" id="demo-motion" type="button">Pause motion</button>
      </figcaption>
    </figure>
  </main>
  <script type="module">
    const status = document.getElementById("demo-status");
    status.textContent = "Loading the park and Centauri models\u2026";
    try {
      const { startDemo } = await import("./scene.js");
      await startDemo();
    } catch (error) {
      console.error("Unable to start the Centauri demo.", error);
      status.textContent = "The 3D scene could not load. Check your connection and WebGL support, then reload to try again.";
    }
  </script>
</body>
</html>
