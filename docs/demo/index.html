<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Explore the Centauri quadcopter, transmitter, and Link radio monitor together in an interactive 3D park scene." />
  <title>Centauri in Flight | Full Stack Flight</title>
  <link rel="icon" type="image/svg+xml" href="../full-stack-flight.svg" />
  <link rel="stylesheet" href="../styles.css" />
  <link rel="stylesheet" href="demo.css" />
  <script type="importmap">
    { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    } }
  </script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="header-inner demo-header">
      <a class="site-brand" href="../" aria-label="Full Stack Flight home">
        <img src="../full-stack-flight.svg" alt="" width="43" height="43" />
        <span>Full Stack Flight</span>
      </a>
      <a class="demo-back" href="../#ecosystem">Centauri ecosystem <span aria-hidden="true">&rarr;</span></a>
    </div>
  </header>

  <main class="demo" id="main">
    <p class="demo-kicker">The Centauri ecosystem / 3D demo</p>
    <h1>Centauri in flight</h1>
    <p class="demo-intro">A pilot flies Centauri from a picnic table while a second person farther down the path uses Link to check that radio messages are getting through.</p>

    <figure class="demo-figure">
      <div class="demo-stage">
        <canvas id="park" role="img" aria-label="A sunny park with a seated pilot using a wired Xbox controller connected to the Centauri transmitter, the quadcopter hovering over the lawn, and a person holding the Link radio monitor farther down the path."></canvas>
        <p id="demo-status" class="demo-status" role="status"></p>
        <noscript><p class="demo-status">Enable JavaScript to view the 3D scene.</p></noscript>
      </div>
      <figcaption class="demo-toolbar" id="demo-toolbar" hidden>
        <div class="demo-views" role="group" aria-label="Camera views">
          <button type="button" data-view="overview" aria-pressed="true">Overview</button>
          <button type="button" data-view="pilot" aria-pressed="false">Pilot</button>
          <button type="button" data-view="quadcopter" aria-pressed="false">Quadcopter</button>
          <button type="button" data-view="link" aria-pressed="false">Link</button>
        </div>
        <p class="demo-hint">Drag to look around. Scroll or pinch to zoom.</p>
        <button class="demo-motion" id="demo-motion" type="button">Pause motion</button>
      </figcaption>
    </figure>
  </main>
  <script type="module">
    const status = document.getElementById("demo-status");
    status.textContent = "Loading the park and Centauri models\u2026";
    try {
      const { startDemo } = await import("./scene.js");
      await startDemo();
    } catch (error) {
      console.error("Unable to start the Centauri demo.", error);
      status.textContent = "The 3D scene could not load. Check your connection and WebGL support, then reload to try again.";
    }
  </script>
</body>
</html>
